version: 2.1

setup: true

parameters:
  region:
    type: string
    default: us-east-1

orbs:
  buildomat: teak/buildomat@0.1

references:
  ONLY_DEVELOP: &ONLY_DEVELOP
    filters:
      branches:
        only:
          - develop
  ONLY_MAIN: &ONLY_MAIN
    filters:
      branches:
        only:
          - main
  packer-build: &packer-build
    image: teakinc/ansible:current
    except: vagrant.*,amazon-ebs.*
    version: 1.7.5-dev2
    github_releases_user: AlexSc
    gpg_key_id: EC3A3F7C6C4F9D25
    name: "Generate Images (<< pipeline.parameters.build_account_slug >>)"
    post-steps:
      - store_artifacts:
          path: "manifests/"
      - store_artifacts:
          path: "raw_manifests/"
    path: "packer"
    var: "region=<< pipeline.parameters.region >>,build_account_canonical_slug=<< pipeline.parameters.build_account_slug >>,cost_center=root_image"
    context:
      - AWS-OIDC-Role
      - Vagrant
      - CircleCI

workflows:
  version: 2
  terraform-plan:
    jobs:
      - buildomat/terraform-plan:
          version: 1.3.6
          path: "terraform"
          continuation: true
          var: "region=<< pipeline.parameters.region >>"
          context: AWS-OIDC-Role
          name: "Plan (Production)"
          workspace: "production-ci-cd"
          continuation_parameters: "region=<< pipeline.parameters.region >>,build_account_slug=production-ci-cd"
          <<: *ONLY_MAIN
      - buildomat/terraform-continuation:
          <<: *ONLY_MAIN
          name: "Continue (Production)"
          requires:
            - "Plan (Production)"
      - buildomat/packer-build:
          <<: *packer-build
          <<: *ONLY_DEVELOP
          name: "Generate Images (development-ci-cd)"
          var: "region=<< pipeline.parameters.region >>,build_account_canonical_slug=development-ci-cd,cost_center=root_image"
      - buildomat/build-dependent-images: &build-depdendent-images
          region: << pipeline.parameters.region >>
          build_account_slug: development-ci-cd
          ami_name_prefix: "root"
          requires:
            - "Generate Images (development-ci-cd)"
          context:
            - AWS-OIDC-Role
            - CircleCI
