---
- hosts: all

  vars:
    build_environment: production

  pre_tasks:
    - include_vars: "{{ item }}"
      with_first_found:
        - "vars_{{ build_environment }}.yml"
        - "vars_default.yml"

  tasks:
    # bullseye-security moved to archive.debian.org after Debian 11 LTS ended, so
    # security.debian.org 404s on every deb11uN package. Raw so it runs before
    # ansible's apt module bootstraps python3-apt.
    - name: Point bullseye-security at archive.debian.org and refresh apt
      become: yes
      raw: |
        set -e
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] || continue
          sed -i -E 's#https?://(security|deb)\.debian\.org/debian-security#http://archive.debian.org/debian-security#g' "$f"
        done
        DEBIAN_FRONTEND=noninteractive apt-get update
      changed_when: true

    - name: Remove backports
      become: yes
      lineinfile: 
        dest: /etc/apt/sources.list
        state: absent 
        regexp: "backports"

    - name:  Install FAI Packages
      become: yes
      apt:
        update_cache: yes
        install_recommends: no
        state: present
        name:
          - git
          - ca-certificates
          - debsums
          - dosfstools
          - fai-server
          - fai-setup-storage
          - make
          - python3
          - python3-libcloud
          - python3-marshmallow
          - python3-pytest
          - python3-yaml
          - qemu-utils
          - udev

    - name: Install ddpt
      become: yes
      apt:
        update_cache: no
        install_recommends: no
        state: present
        name:
          - ddpt

    - name: Created Build Directory
      become: yes
      file:
        path: /build
        group: admin
        owner: admin
        mode: '755'
        state: directory

    - name: Clone Repo
      git:
        dest: /build/debian-cloud-images
        repo: https://github.com/GoCarrot/debian-cloud-images.git
        version: "{{ debian_cloud_images_branch }}"
